<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PawTown SF</title>
<style>
  :root { --bg:#bfe6ff; --panel:#fffdf7; --ink:#2b2a33; --muted:#6b6878; --line:#e8e2d4; --accent:#ff7a59;
          --em:#e5322d; --today:#ff8a00; --week:#e6b800; --home:#2fa84f; --info:#3478f6; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
              color:var(--ink); background:var(--bg); overflow:hidden; }
  #scene { position:fixed; inset:0; }
  #labels { position:fixed; inset:0; pointer-events:none; }
  .lbl { font-size:12px; font-weight:700; padding:2px 8px; border-radius:999px; background:#fffdf7e6; border:2px solid #2b2a3320;
         white-space:nowrap; transform:translateY(-6px); }
  .lbl.hood { font-size:13px; background:#2b2a33cc; color:#fff; border:none; }
  .lbl.vet { background:#fff; border-color:#3478f655; }
  .lbl.er { background:var(--em); color:#fff; border:none; }
  .lbl.pet { font-size:13px; }
  .lbl.member { font-size:16px; background:none; border:none; padding:0; }
  .lbl.timer { background:#fff3d6; border-color:#e6b80088; font-size:11px; }
  .lbl.timer.late { background:var(--today); color:#fff; animation: bob 0.9s infinite alternate; }
  @keyframes bob { to { transform: translateY(-14px); } }
  #hud { position:fixed; top:12px; left:12px; right:12px; display:flex; gap:8px; align-items:center; pointer-events:none; flex-wrap:wrap; }
  #hud > * { pointer-events:auto; }
  .chip { background:var(--panel); border-radius:14px; padding:8px 12px; box-shadow:0 3px 0 #2b2a3322; font-weight:700; font-size:14px; }
  .chip small { color:var(--muted); font-weight:600; }
  button { font:inherit; border:none; border-radius:12px; padding:7px 12px; background:var(--accent); color:#fff; font-weight:700;
           cursor:pointer; box-shadow:0 3px 0 #b8492f; }
  button.ghost { background:#fff; color:var(--ink); box-shadow:0 3px 0 #2b2a3322; }
  button.small { padding:4px 9px; font-size:12px; }
  button:active { transform:translateY(2px); box-shadow:none; }
  select, input { font:inherit; border:2px solid var(--line); border-radius:10px; padding:5px 8px; background:#fff; }
  #panel { position:fixed; top:64px; right:12px; bottom:12px; width:380px; max-width:calc(100vw - 24px); background:var(--panel);
           border-radius:20px; box-shadow:0 6px 0 #2b2a3322; overflow:auto; padding:14px; }
  #panel.collapsed { display:none; }
  h2 { font-size:16px; margin:14px 0 6px; } h2:first-child { margin-top:0; }
  .petcard { border:2px solid var(--line); border-radius:14px; padding:8px 10px; margin-bottom:8px; cursor:pointer; }
  .petcard.sel { border-color:var(--accent); }
  .pill { display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px; color:#fff; }
  .u-emergency_now{background:var(--em)} .u-vet_today{background:var(--today)} .u-vet_this_week{background:var(--week)}
  .u-monitor_at_home{background:var(--home)} .u-none{background:#9a96a8}
  .quest { display:flex; gap:8px; align-items:flex-start; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .quest.done { opacity:.5; } .quest .t { flex:1; } .quest .meta { color:var(--muted); font-size:11px; }
  .kind { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:1px 6px; border-radius:6px; background:#eee; }
  .k-contagion{background:#efe2ff;color:#6a2fc9} .k-med{background:#ffe2e2;color:#b02020} .k-recheck{background:#fff1c9;color:#8a6500}
  .k-immediate{background:#ffe6d9;color:#b8492f} .k-watch{background:#e6f1ff;color:#2453a6}
  .ev { font-size:12px; padding:4px 0; border-bottom:1px solid #f1ede3; } .ev time { color:var(--muted); font-size:10px; margin-right:6px; }
  .ev.scan { color:#2453a6; font-weight:700; } .ev.warning { color:#b02020; font-weight:700; } .ev.contagion { color:#6a2fc9; } .ev.emergency { color:var(--em); font-weight:800; }
  .board { display:flex; gap:6px; flex-wrap:wrap; } .board .chip { box-shadow:none; border:2px solid var(--line); font-size:13px; }
  .badge { display:inline-flex; gap:4px; align-items:center; background:#fff7e0; border-radius:10px; padding:4px 8px; margin:2px; font-size:12px; font-weight:700; }
  .muted { color:var(--muted); font-size:12px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px;
           border-radius:14px; font-weight:700; display:none; max-width:90vw; z-index:20; }
  #emerg { position:fixed; inset:0; display:none; pointer-events:none; box-shadow: inset 0 0 0 10px var(--em); z-index:10; }
  #emergCard { position:fixed; left:12px; bottom:12px; width:420px; max-width:calc(100vw - 24px); background:var(--em); color:#fff; border-radius:20px;
               padding:16px; display:none; z-index:11; box-shadow:0 6px 0 #8f1a17; }
  #emergCard h1 { margin:0 0 6px; font-size:22px; } #emergCard button { background:#fff; color:var(--em); box-shadow:0 3px 0 #8f1a17; }
  #emergCard a { color:#fff; font-weight:800; }
  #popup { position:fixed; display:none; background:var(--panel); border-radius:14px; padding:10px 12px; box-shadow:0 4px 0 #2b2a3333; font-size:13px;
           max-width:260px; z-index:12; }
  .fwchip { display:inline-block; background:#2b2a33; color:#fff; border-radius:999px; padding:2px 8px; font-size:11px; font-weight:700; }
  .fwchip b { color:#ffb36b; }
  #lab table { border-collapse:collapse; width:100%; font-size:13px; } #lab td, #lab th { border-bottom:1px solid var(--line); padding:6px; text-align:left; }
  #lab img { max-width:100%; border-radius:12px; border:2px solid var(--line); }
  #attr { position:fixed; left:12px; bottom:8px; font-size:10px; color:#2b2a33aa; }
  #attr a { color:inherit; }
  @media (max-width: 700px) { #panel { top:auto; height:55vh; width:auto; left:12px; } #emergCard { bottom:auto; top:64px; } }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<div id="emerg"></div>

<div id="hud">
  <div class="chip">🐾 PawTown SF <small id="denName"></small></div>
  <div class="chip" id="fogChip" title="Fog clears as the Den finishes its care steps">🌫️ <span id="fogPct">–</span></div>
  <div class="chip">Den <select id="denPick"></select></div>
  <div class="chip">View as <select id="viewAs"></select></div>
  <button class="ghost" id="btnSeed" title="Creates a demo Den + 1 real photo triage (≈$0.001)">Seed demo Den</button>
  <button class="ghost" id="btnWalker" title="Adds a 2nd Den where Jordan also walks a dog (no model call)">+ Walker's 2nd Den</button>
  <button class="ghost" id="btnTime" title="Demo clock: move every timer forward 24h">⏩ +24h</button>
  <button class="ghost" id="btnEmerg" title="Real triage call (≈$0.001): text that should trigger the emergency rules">Demo: Pepper ate chocolate</button>
  <a href="/" style="pointer-events:auto"><button class="ghost">Triage app ↗</button></a>
  <a id="scanLink" target="_blank" style="pointer-events:auto;display:none"><button class="ghost" title="Scans of a pet whose name matches a Den pet land here as a case">📷 Live scan ↗</button></a>
  <button class="ghost" id="btnSound" title="Synthesized pet + game sounds">🔊 Sound</button>
  <button class="ghost" id="btnMusic" title="Background music (original, synthesized live)">🎵 Music</button>
  <button id="btnPanel">Den ▸</button>
</div>

<div id="panel"></div>
<div id="emergCard"></div>
<div id="popup"></div>
<div id="lab" style="position:fixed;inset:5vh 5vw;background:var(--panel);border-radius:20px;box-shadow:0 8px 0 #2b2a3333;z-index:30;display:none;overflow:auto;padding:18px"></div>
<div id="toast"></div>
<div id="attr">Map data <a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap contributors</a> (ODbL) · cartoon geometry is approximate · PawTriage is triage support, not a diagnosis</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ---------------------------------------------------------------- projection (1 unit ≈ 100 m)
const LAT0 = 37.765, LON0 = -122.445, K = 1113.2, CL = Math.cos(LAT0 * Math.PI / 180);
const P = (lat, lon) => new THREE.Vector3((lon - LON0) * K * CL, 0, -(lat - LAT0) * K);
const haversineKm = (a, b) => { const R = 6371, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lon - a.lon) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

const HOODS = {
  "Mission":         { lat: 37.7599, lon: -122.4148, color: 0xffb36b },
  "Dolores Park":    { lat: 37.7596, lon: -122.4269, color: 0x8fd16a },
  "Golden Gate Park":{ lat: 37.7694, lon: -122.4862, color: 0x5cb85c },
  "Presidio":        { lat: 37.7989, lon: -122.4662, color: 0x4f9d55 },
  "Crissy Field":    { lat: 37.8039, lon: -122.4641, color: 0xf3dc9b },
  "Fort Funston":    { lat: 37.7178, lon: -122.5023, color: 0xf0d58c },
  "Bernal Heights":  { lat: 37.7429, lon: -122.4155, color: 0x9fd49a },
  "Ocean Beach":     { lat: 37.7594, lon: -122.5097, color: 0xf6e1a8 },
  "Alamo Square":    { lat: 37.7764, lon: -122.4346, color: 0xa7d98a },
};

// ---------------------------------------------------------------- renderer / scene
const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer({ element: document.getElementById('labels') });
labelR.setSize(innerWidth, innerHeight);

const scene = new THREE.Scene();
const SKY = new THREE.Color(0xbfe6ff), SKY_RED = new THREE.Color(0x5a1b1b);
scene.background = SKY.clone();
scene.fog = new THREE.Fog(0xdfeff8, 120, 420);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 2000);
camera.position.set(40, 110, 150);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0); controls.enableDamping = true; controls.maxPolarAngle = 1.35; controls.minDistance = 15; controls.maxDistance = 400;

scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa77, 1.1));
const sun = new THREE.DirectionalLight(0xfff2d6, 1.6);
sun.position.set(-80, 160, 60); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, far: 500 });
scene.add(sun);

const pickables = [];
const toon = (c, extra = {}) => new THREE.MeshToonMaterial({ color: c, ...extra });
const mesh = (geo, mat, pos, opts = {}) => { const m = new THREE.Mesh(geo, mat); if (pos) m.position.copy(pos);
  m.castShadow = opts.cast ?? true; m.receiveShadow = opts.receive ?? true; return m; };
const label = (html, cls, obj, y = 3) => { const d = document.createElement('div'); d.className = 'lbl ' + cls; d.innerHTML = html;
  const o = new CSS2DObject(d); o.position.set(0, y, 0); obj.add(o); return o; };

// ---------------------------------------------------------------- water + land (cartoon SF outline)
const water = mesh(new THREE.CircleGeometry(700, 64), toon(0x5fc4e8), null, { cast: false });
water.rotation.x = -Math.PI / 2; water.position.y = -0.6; scene.add(water);
const COAST = [[37.7880,-122.5060],[37.7790,-122.5135],[37.7600,-122.5110],[37.7350,-122.5070],[37.7080,-122.5030],
  [37.7080,-122.4600],[37.7080,-122.3930],[37.7200,-122.3780],[37.7300,-122.3650],[37.7420,-122.3740],[37.7550,-122.3860],
  [37.7700,-122.3870],[37.7820,-122.3880],[37.7950,-122.3920],[37.8060,-122.4030],[37.8090,-122.4180],[37.8070,-122.4320],
  [37.8060,-122.4480],[37.8040,-122.4650],[37.8100,-122.4770],[37.8040,-122.4830],[37.7900,-122.4860],[37.7880,-122.5060]];
const shape = new THREE.Shape(COAST.map(([la, lo]) => { const v = P(la, lo); return new THREE.Vector2(v.x, -v.z); }));
const landGeo = new THREE.ExtrudeGeometry(shape, { depth: 1.2, bevelEnabled: true, bevelThickness: 0.6, bevelSize: 1.2, bevelSegments: 3 });
landGeo.rotateX(-Math.PI / 2);
scene.add(mesh(landGeo, toon(0xf4e7c5), null, { cast: false }));
// Marin headlands across the Gate
const marin = mesh(new THREE.SphereGeometry(30, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), toon(0x97c97a), P(37.838, -122.485));
marin.scale.set(1.4, 0.35, 0.5); scene.add(marin);
const G = 1.8; // ground top

// Golden Gate Park strip
{ const a = P(37.7735, -122.5105), b = P(37.7655, -122.4545);
  const w = b.x - a.x, d = b.z - a.z;
  const park = mesh(new THREE.BoxGeometry(w, 0.5, Math.abs(d)), toon(0x6cc070), new THREE.Vector3((a.x + b.x) / 2, G, (a.z + b.z) / 2));
  scene.add(park);
  for (let i = 0; i < 26; i++) tree(new THREE.Vector3(a.x + Math.random() * w, G, a.z + Math.random() * d), 0.8 + Math.random() * 0.6);
}
// Presidio forest
for (let i = 0; i < 30; i++) { const c = P(37.7989, -122.4662); tree(new THREE.Vector3(c.x + (Math.random() - .5) * 26, G, c.z + (Math.random() - .5) * 14), 0.9 + Math.random() * .6); }
// hills
function hill(lat, lon, r, h, c) { const m = mesh(new THREE.SphereGeometry(r, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), toon(c), P(lat, lon)); m.scale.y = h / r; m.position.y = G - .2; scene.add(m); return m; }
hill(37.7544, -122.4477, 9, 7, 0x9fcf7f);   // Twin Peaks
hill(37.7429, -122.4155, 6, 4, 0x9fd49a);   // Bernal
hill(37.7300, -122.4500, 7, 3, 0xb2d78f);   // Mt Davidson-ish
function tree(pos, s = 1) {
  const g = new THREE.Group(); g.position.copy(pos);
  g.add(mesh(new THREE.CylinderGeometry(.15 * s, .2 * s, 1 * s), toon(0x8b5a2b), new THREE.Vector3(0, .5 * s, 0)));
  g.add(mesh(new THREE.ConeGeometry(.9 * s, 2 * s, 7), toon(0x3f9b4b), new THREE.Vector3(0, 1.9 * s, 0)));
  scene.add(g); return g;
}

// ---------------------------------------------------------------- landmarks from primitives
{ // Golden Gate Bridge: south tower 37.8105,-122.4777 to north 37.8270,-122.4790
  const s = P(37.8105, -122.4777), n = P(37.8300, -122.4790), red = toon(0xd9502b);
  const len = s.distanceTo(n), mid = s.clone().add(n).multiplyScalar(.5);
  const deck = mesh(new THREE.BoxGeometry(2.2, .5, len), red, mid); deck.position.y = 5; deck.lookAt(n.x, 5, n.z); scene.add(deck);
  for (const t of [s.clone().lerp(n, .18), s.clone().lerp(n, .82)]) {
    for (const dx of [-.9, .9]) scene.add(mesh(new THREE.BoxGeometry(.5, 14, .5), red, new THREE.Vector3(t.x + dx, 7, t.z)));
    scene.add(mesh(new THREE.BoxGeometry(2.4, .5, .5), red, new THREE.Vector3(t.x, 13, t.z)));
  }
  const curve = new THREE.CatmullRomCurve3([s.clone().setY(5), s.clone().lerp(n, .18).setY(13.5), s.clone().lerp(n, .5).setY(7),
                                             s.clone().lerp(n, .82).setY(13.5), n.clone().setY(5)]);
  for (const dx of [-1, 1]) { const c = mesh(new THREE.TubeGeometry(curve, 40, .12, 6), red); c.position.x = dx; scene.add(c); }
}
{ // Painted Ladies (Alamo Square)
  const a = P(37.7762, -122.4329), cols = [0xf7a1c4, 0x9fd8f5, 0xfbe28a, 0xb7e4a8, 0xd6b4f7, 0xffc39e, 0xa8e6e0];
  cols.forEach((c, i) => { const g = new THREE.Group(); g.position.set(a.x + i * 1.3, G, a.z + 3);
    g.add(mesh(new THREE.BoxGeometry(1.1, 2, 1.4), toon(c), new THREE.Vector3(0, 1, 0)));
    const roof = mesh(new THREE.ConeGeometry(.95, 1, 4), toon(0x6b4a6e), new THREE.Vector3(0, 2.5, 0)); roof.rotation.y = Math.PI / 4; g.add(roof);
    scene.add(g); });
}
{ // Sutro Tower
  const p = P(37.7552, -122.4528); p.y = G + 6;
  for (const a of [0, 2.09, 4.19]) { const leg = mesh(new THREE.CylinderGeometry(.15, .3, 14), toon(0xe04040), p.clone().add(new THREE.Vector3(Math.cos(a) * 1.2, 7, Math.sin(a) * 1.2))); leg.rotation.z = Math.cos(a) * .08; leg.rotation.x = -Math.sin(a) * .08; scene.add(leg); }
  for (const y of [9, 12]) scene.add(mesh(new THREE.TorusGeometry(1.1, .12, 6, 12), toon(0xffffff), p.clone().add(new THREE.Vector3(0, y, 0))).rotateX(Math.PI / 2));
}
{ // Transamerica + downtown blocks
  const t = P(37.7952, -122.4028); scene.add(mesh(new THREE.ConeGeometry(1.6, 12, 4), toon(0xeeeeee), t.clone().setY(G + 6)));
  for (let i = 0; i < 22; i++) { const h = 2 + Math.random() * 7; scene.add(mesh(new THREE.BoxGeometry(1.6, h, 1.6), toon([0xcfd8e3, 0xb8c6d6, 0xe3e8ee][i % 3]),
    new THREE.Vector3(t.x + (Math.random() - .3) * 12, G + h / 2, t.z + (Math.random() - .1) * 12))); }
  const coit = P(37.8024, -122.4058); scene.add(mesh(new THREE.CylinderGeometry(.7, .8, 6, 14), toon(0xf2efe6), coit.setY(G + 3)));
}

// ---------------------------------------------------------------- Fireworks Lab (Mission Bay): the eval lives in the world
const labObj = new THREE.Group();
{ const p = P(37.7705, -122.3915); labObj.position.copy(p); labObj.position.y = G;
  labObj.add(mesh(new THREE.CylinderGeometry(3.2, 3.6, 3, 8), toon(0x2b2a33), new THREE.Vector3(0, 1.5, 0)));
  const dome = mesh(new THREE.SphereGeometry(3, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), toon(0xff7a59, { emissive: 0xff5a1f, emissiveIntensity: .35 }), new THREE.Vector3(0, 3, 0));
  labObj.add(dome);
  const flask = mesh(new THREE.ConeGeometry(.9, 1.8, 16), toon(0x9be7ff, { transparent: true, opacity: .8 }), new THREE.Vector3(0, 6.6, 0)); labObj.add(flask);
  flask.userData.spin = true;
  label('🧪 Fireworks Lab · the eval', 'er', labObj, 8.4);
  labObj.traverse(o => { if (o.isMesh) { o.userData = { ...o.userData, type: 'lab' }; pickables.push(o); } });
  scene.add(labObj); }

// ---------------------------------------------------------------- neighborhood islands
const hoodTiles = {};
for (const [name, h] of Object.entries(HOODS)) {
  const g = new THREE.Group(); g.position.copy(P(h.lat, h.lon)); g.position.y = G;
  g.add(mesh(new THREE.CylinderGeometry(5.5, 6, .6, 28), toon(h.color), new THREE.Vector3(0, .3, 0)));
  label(name, 'hood', g, 1.8); scene.add(g); hoodTiles[name] = g;
}

// ---------------------------------------------------------------- fog puffs (clear as care steps get done)
const fogPuffs = [];
{ const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, opacity: .55, depthWrite: false });
  for (let i = 0; i < 55; i++) {
    const g = new THREE.Group(); const lat = 37.71 + Math.random() * .1, lon = -122.51 + Math.random() * .13;
    g.position.copy(P(lat, lon)); g.position.y = 18 + Math.random() * 8;
    for (let j = 0; j < 4; j++) { const b = new THREE.Mesh(new THREE.SphereGeometry(1.5 + Math.random() * 1.5, 12, 8), mat);
      b.position.set((Math.random() - .5) * 6, Math.random() * 1.5, (Math.random() - .5) * 4); g.add(b); }
    g.userData.seed = Math.random() * 100; scene.add(g); fogPuffs.push(g);
  }
}

// ---------------------------------------------------------------- OSM places: vets + dog parks
let places = { vets: [], dog_parks: [], source: null };
async function loadPlaces() {
  places = await (await fetch('/map/places')).json();
  for (const v of places.vets) {
    const g = new THREE.Group(); g.position.copy(P(v.lat, v.lon)); g.position.y = G;
    const col = v.emergency ? 0xe5322d : 0x3478f6;
    g.add(mesh(new THREE.CylinderGeometry(.18, .18, 4), toon(0xffffff), new THREE.Vector3(0, 2, 0)));
    const head = mesh(new THREE.SphereGeometry(.9, 16, 12), toon(col, { emissive: col, emissiveIntensity: .25 }), new THREE.Vector3(0, 4.4, 0));
    g.add(head);
    const cross = new THREE.Group(); cross.position.set(0, 4.4, .85);
    cross.add(mesh(new THREE.BoxGeometry(.9, .28, .1), toon(0xffffff))); cross.add(mesh(new THREE.BoxGeometry(.28, .9, .1), toon(0xffffff)));
    g.add(cross);
    if (v.emergency) { const ring = new THREE.Mesh(new THREE.RingGeometry(1.4, 1.9, 32), new THREE.MeshBasicMaterial({ color: col, transparent: true, side: THREE.DoubleSide }));
      ring.rotation.x = -Math.PI / 2; ring.position.y = .2; ring.userData.pulse = true; g.add(ring); label('24h ER · ' + v.name, 'er', g, 6.2); }
    head.userData = { type: 'vet', v }; pickables.push(head);
    g.userData.vet = v; scene.add(g);
  }

function nearestER(from) {
  const ers = places.vets.filter(v => v.emergency);

}

// ---------------------------------------------------------------- background music: an original 8-bar loop, synthesized live
const MUSIC = (() => {
  let ctx = null, bus = null, on = true, playing = false, timer = null, step = 0, nextT = 0, ducked = false;
  try { on = localStorage.getItem('ptMusic') !== 'off'; } catch (e) {}
  const BPM = 104, EIGHTH = 60 / BPM / 2, VOL = .16;
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  // I–V–vi–IV, then a turnaround: C G Am F | C G F C
  const CHORDS = [[48, 52, 55], [43, 47, 50], [45, 48, 52], [41, 45, 48], [48, 52, 55], [43, 47, 50], [41, 45, 48], [48, 52, 55]];
  const MEL = [[72, 76, 79, 76], [74, 71, 74, null], [72, 76, 81, 79], [77, 76, 72, null],
               [79, 76, 72, 76], [74, 71, 67, 71], [72, 69, 72, 77], [76, 74, 72, null]];
  const ensure = () => { if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); bus = ctx.createGain(); bus.gain.value = 0;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5000; bus.connect(lp); lp.connect(ctx.destination); }
    if (ctx.state === 'suspended') ctx.resume(); return ctx; };
  let NB = null;
  const noise = () => { if (!NB) { NB = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ctx.createBufferSource(); s.buffer = NB; return s; };
  const pluck = (f, t, dur, vol, type = 'triangle', bright = 4) => { const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain();
    o.type = type; o.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * bright; g2.gain.value = .18;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(bus);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.start(t); o2.start(t); o.stop(t + dur + .02); o2.stop(t + dur + .02); };
  const whistle = (f, t, dur, vol) => { const o = ctx.createOscillator(), g = ctx.createGain(), l = ctx.createOscillator(), lg = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f; l.frequency.value = 5.5; lg.gain.value = f * .008; l.connect(lg); lg.connect(o.frequency); o.connect(g); g.connect(bus);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .04); g.gain.setValueAtTime(vol, t + dur * .6); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.start(t); l.start(t); o.stop(t + dur + .02); l.stop(t + dur + .02); };
  const hat = (t, vol) => { const n = noise(), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = 'highpass'; f.frequency.value = 7000;
    n.connect(f); f.connect(g); g.connect(bus); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .04); n.start(t); n.stop(t + .05); };
  const kick = (t, vol) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(48, t + .12);
    o.connect(g); g.connect(bus); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.start(t); o.stop(t + .2); };
  function schedule() {
    while (nextT < ctx.currentTime + .2) {
      const bar = Math.floor(step / 8) % 8, e = step % 8, ch = CHORDS[bar], t = nextT;
      // marimba arpeggio (8ths): root 5th oct 3rd 5th oct 3rd 5th
      const arp = [ch[0] + 12, ch[2] + 12, ch[0] + 24, ch[1] + 12, ch[2] + 12, ch[0] + 24, ch[1] + 24, ch[2] + 12];
      pluck(mf(arp[e]), t, .35, .11);
      if (e === 0 || e === 4) { pluck(mf(ch[0] - 12 + 12), t, .5, .16, 'triangle', 2); kick(t, .22); }  // bass + soft kick
      if (e === 6) pluck(mf(ch[2]), t, .3, .08, 'triangle', 2);                                         // bass walk-up
      if (e % 2 === 1) hat(t, .03);
      if (e % 2 === 0) { const m = MEL[bar][e / 2]; if (m) whistle(mf(m), t, EIGHTH * 1.8, .055); }      // whistled melody
      nextT += EIGHTH; step++;

  }

  function stop() { if (!playing) return; fadeTo(0, .6); setTimeout(() => { clearInterval(timer); playing = false; }, 700); }
  return { get on() { return on; },
    set(v) { on = v; try { localStorage.setItem('ptMusic', v ? 'on' : 'off'); } catch (e) {} v ? start() : stop(); },
    unlock() { if (on) start(); },
    duck(d) { ducked = d; if (playing) fadeTo(d ? 0 : VOL, d ? .8 : 3); } };
})();

async function refresh(force = false) {
  const dens = await api('/dens');
  if (!dens.length) { den = null; renderPanel(); rebuildDyn(); return; }
  if (!denId || !dens.find(d => d.id === denId)) denId = dens[0].id;
  $('denPick').innerHTML = dens.map(d => `<option value="${d.id}" ${d.id === denId ? 'selected' : ''}>${esc(d.name)}</option>`).join('');
  const d = await api(`/dens/${denId}` + (viewAs ? `?as_member=${viewAs}` : ''));
  const sig = JSON.stringify(d);
  if (!force && sig === lastSig) return;
  if (!!d.emergency !== !!emergency || (d.emergency && !den)) MUSIC.duck(!!d.emergency);
  const prevEm = emergency, prevBadges = new Set((den?.badges || []).map(b => b.id)), prevTop = den?.events?.[0]?.at, prevDen = den?.id;
  lastSig = sig; den = d; emergency = d.emergency;
  if (prevDen === d.id) soundForChanges(prevEm, prevBadges, prevTop);
  if (!viewAs || !d.members.find(m => m.id === viewAs)) { viewAs = d.members[0]?.id; }
  $('viewAs').innerHTML = d.members.map(m => `<option value="${m.id}" ${m.id === viewAs ? 'selected' : ''}>${m.emoji} ${esc(m.name)} (${m.role})</option>`).join('');
  $('denName').textContent = '· ' + d.name + ' · ' + d.neighborhood;
  renderPanel(); rebuildDyn(); renderEmergency(); updateFog();
}

function updateFog() {
  const care = (den?.quests || []).filter(q => q.kind !== 'watch');
  const done = care.filter(q => q.status === 'done').length, tot = care.length;
  const clear = tot ? done / tot : 0;
  $('fogPct').textContent = tot ? `${Math.round(clear * 100)}% of care steps done · fog clearing` : 'no care steps yet';
  const dc = denCenter(); fogPuffs.forEach((f, i) => f.userData.target = ((i / fogPuffs.length) < clear || Math.hypot(f.position.x - dc.x, f.position.z - dc.z) < 28) ? 0 : 1);
}

function petById(id) { return den?.pets.find(p => p.id === id); }
function soundForChanges(prevEm, prevBadges, prevTop) {
  if (!SFX.on) return;
  if (emergency && !prevEm) { SFX.siren(4); setTimeout(() => SFX.howl(), 800); return; }
  if (!emergency && prevEm) { SFX.chime([523, 659, 784], 0, .15); setTimeout(() => SFX.purr(0, 1.2), 500); }
  const fresh = prevTop ? den.events.filter(e => e.at > prevTop) : [];
  const kinds = new Set(fresh.map(e => e.kind));
  if (kinds.has('scan')) { SFX.shutter(); const p = petById(fresh.find(e => e.kind === 'scan').pet_id); setTimeout(() => SFX.voice(p), 350); }
  else if (kinds.has('case')) { SFX.chime([659, 880], 0, .12, .18); }
  if (kinds.has('contagion')) setTimeout(() => SFX.whoosh(), 600);
  const nb = (den.badges || []).filter(b => !prevBadges.has(b.id));
  if (nb.length && prevBadges.size + nb.length > 0 && fresh.length) setTimeout(() => { SFX.fanfare(); toast(`🏅 Badge: ${nb[0].name}`); }, 900);
}

    const q = den.quests.find(x => x.id === id); if (r.points) SFX.coin(); setTimeout(() => SFX.voice(petById(q?.pet_id)), 250); }

let fly = null;
function flyTo(target, dist = 40) {
  const dir = camera.position.clone().sub(controls.target).normalize();
  fly = { t: 0, fromT: controls.target.clone(), toT: target.clone(), fromP: camera.position.clone(), toP: target.clone().add(dir.multiplyScalar(dist)).setY(target.y + dist * .7) };
}

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (fly) { fly.t = Math.min(1, fly.t + dt * .9); const k = 1 - (1 - fly.t) ** 3;
    controls.target.lerpVectors(fly.fromT, fly.toT, k); camera.position.lerpVectors(fly.fromP, fly.toP, k); if (fly.t >= 1) fly = null; }
  for (const g of petObjs) { const u = g.userData, ph = t * .6 + u.phase;
    const sick = u.p.case && u.p.case.urgency !== 'monitor_at_home';
    const r = sick ? .3 : 1.2;  // sick pets rest near home, healthy ones roam
    g.position.x = u.home.x + Math.cos(ph) * r; g.position.z = u.home.z + Math.sin(ph) * r;
    g.position.y = u.home.y + Math.abs(Math.sin(t * (sick ? 2 : 6) + u.phase)) * (sick ? .05 : .25);
    g.rotation.y = -ph + (sick ? 0 : Math.PI); }
  scene.traverse(o => { if (o.userData?.pulse) { const s = 1 + (Math.sin(t * 4) * .5 + .5) * .6; o.scale.set(s, s, s); o.material.opacity = 1.2 - s * .5; }
    if (o.userData?.spin) o.rotation.y = t * 1.5;
    if (o.userData?.bob !== undefined) o.position.y = G + .6 + Math.abs(Math.sin(t * 3 + o.userData.bob)) * .15; });
  for (const f of fogPuffs) { const tgt = (f.userData.target ?? 1) * 1; const cur = f.scale.x; const nx = cur + (Math.max(tgt, .001) - cur) * dt * 1.5;
    f.scale.setScalar(nx); f.visible = nx > .02; f.position.x += Math.sin(t * .1 + f.userData.seed) * .01; }
  scene.background.lerp(emergency ? SKY_RED : SKY, dt * 2);
  controls.update(); renderer.render(scene, camera); labelR.render(scene, camera);
  requestAnimationFrame(tick);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight); });

api('/pawtown/config').then(c => { if (c.scanner_url) { $('scanLink').href = c.scanner_url; $('scanLink').style.display = ''; } }).catch(() => {});
await loadPlaces();
await refresh(true);
if (den) flyTo(denCenter(), 45);
setInterval(() => refresh().catch(() => {}), 5000);
if (location.hash === '#lab') openLab();
tick();
</script>
